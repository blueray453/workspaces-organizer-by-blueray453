<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Window Selector — UX Prototype v4 (Focus strip + scrubber)</title>
<style>
:root {
  --halo:
    0 0 1px rgba(0,22,30,1),
    0 0 3px rgba(0,22,30,0.95),
    0 0 8px rgba(0,22,30,0.85),
    0 0 18px rgba(0,22,30,0.70),
    0 2px 30px rgba(0,22,30,0.55);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #001a22; }
body { font-family: 'Cantarell', 'Segoe UI', system-ui, sans-serif; }

#overlay { position: fixed; inset: 0; overflow: hidden; }

/* ---------- full-screen preview (two layers for crossfade) ---------- */
#revealed { position: absolute; inset: 0; z-index: 0; cursor: pointer; }
.bg-layer { position: absolute; inset: 0; opacity: 0; }
.bg-layer svg { width: 100%; height: 100%; display: block; }

/* ---------- barely-there tint: only the far edges get a little darker ---------- */
#tint {
  position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background:
    radial-gradient(ellipse 90% 80% at 50% 50%,
      rgba(0,26,34,0) 55%, rgba(0,26,34,0.22) 100%);
  transition: opacity 220ms ease;
}

/* ---------- neighbor rows (2 above, 2 below) ---------- */
#rows { position: absolute; inset: 0; z-index: 2; pointer-events: none; transition: opacity 220ms ease; }
.row {
  position: absolute; left: 0; right: 0; top: 0;
  display: flex; align-items: center; justify-content: center;
  will-change: transform, opacity; cursor: pointer;
}
.row-inner { display: flex; align-items: center; gap: 0.5em; max-width: 60%; }
.row-icon { flex-shrink: 0; display: flex; filter: drop-shadow(0 1px 6px rgba(0,22,30,0.8)); }
.row-icon svg { display: block; }
.row-label { color: #f1ede0; font-weight: 600; white-space: nowrap; text-shadow: var(--halo); }

/* ---------- middle section ---------- */
#band {
  position: absolute; left: 0; right: 0; z-index: 4; pointer-events: none;
  background: linear-gradient(to bottom,
    rgba(0,26,34,0) 0%, rgba(0,26,34,0.24) 24%,
    rgba(0,26,34,0.24) 76%, rgba(0,26,34,0) 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity 220ms ease;
}
#band-selected { width: 100%; display: flex; align-items: center; justify-content: center; }
#band-selected .sel {
  display: flex; align-items: center; gap: 0.4em; max-width: 80%;
  pointer-events: auto; cursor: pointer;
}
#band-selected .sel-text { display: flex; flex-direction: column; min-width: 0; }
#band-selected .sel-title { color: #fffaf0; font-weight: 700; white-space: nowrap; text-shadow: var(--halo); line-height: 1.15; }
#band-selected .sel-app {
  color: #4fd1c5; font-weight: 700; letter-spacing: 0.12em;
  text-transform: uppercase; margin-top: 0.15em; text-shadow: var(--halo);
}
#band-selected .sel-empty { color: #e3ebe9; font-weight: 600; text-shadow: var(--halo); }

#search-wrap { width: 100%; display: flex; justify-content: center; margin-top: 10px; }
#search-entry {
  pointer-events: auto;
  background: transparent; border: none; outline: none;
  border-bottom: 2px solid rgba(238,232,213,0.75);
  box-shadow: 0 2px 8px rgba(0,22,30,0.7);
  color: #fffaf0; text-align: center; font-family: inherit; font-weight: 600;
  padding: 6px 12px; caret-color: #4fd1c5; text-shadow: var(--halo);
  transition: border-color 150ms;
}
#search-entry:focus { border-bottom-color: #2aa198; }
#search-entry::placeholder { color: #dfe7e5; opacity: 0.8; text-shadow: var(--halo); }

/* ---------- side scrubber ---------- */
#rail {
  position: absolute; right: 14px; top: 10%; bottom: 10%; width: 48px; z-index: 6;
  touch-action: none; cursor: pointer; transition: opacity 220ms ease;
}
#rail .track {
  position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; border-radius: 2px;
  background: rgba(238,232,213,0.55);
  box-shadow: 0 0 0 1px rgba(0,22,30,0.55), 0 0 8px rgba(0,22,30,0.6);
}
#rail .tick {
  position: absolute; left: 50%; width: 12px; height: 4px; margin-left: -6px; margin-top: -2px;
  border-radius: 2px; box-shadow: 0 0 0 1px rgba(0,22,30,0.8);
}
#rail #marker {
  position: absolute; left: 50%; top: 0; width: 32px; height: 8px; margin-left: -16px; margin-top: -4px;
  border-radius: 4px; background: #fffaf0; will-change: transform;
  box-shadow: 0 0 0 2px rgba(0,22,30,0.85), 0 0 14px rgba(0,22,30,0.7);
}
#rail #tip {
  position: absolute; right: 100%; margin-right: 4px; top: 0;
  white-space: nowrap; font-size: 16px; font-weight: 700; color: #fffaf0;
  text-shadow: var(--halo); opacity: 0; transition: opacity 120ms; pointer-events: none;
}
#rail #tip.show { opacity: 1; }

#hint {
  position: absolute; left: 0; right: 0; bottom: 26px; z-index: 5;
  color: #e8efed; text-align: center; pointer-events: none;
  font-size: 14px; font-weight: 600; letter-spacing: 0.04em; opacity: 0.9;
  text-shadow: var(--halo); transition: opacity 220ms ease;
}

/* ---------- activate: UI melts away to reveal the window ---------- */
#overlay.activating #rows, #overlay.activating #band, #overlay.activating #tint,
#overlay.activating #rail, #overlay.activating #hint { opacity: 0; }
#overlay.cancelling #tint { background: rgba(220, 50, 47, 0.18); }
</style>
</head>
<body>
<div id="overlay">
  <div id="revealed"><div class="bg-layer"></div><div class="bg-layer"></div></div>
  <div id="tint"></div>
  <div id="rows"></div>
  <div id="band">
    <div id="band-selected"></div>
    <div id="search-wrap">
      <input id="search-entry" type="text" placeholder="Type to search…" autocomplete="off" spellcheck="false">
    </div>
  </div>
  <div id="rail"><div class="track"></div><div id="ticks"></div><div id="marker"></div><div id="tip"></div></div>
  <div id="hint"></div>
</div>

<script>
// ==================== DATA ====================
const WINDOWS = [

  { app: 'Firefox',     title: 'GNOME Shell Extensions — Mozilla Firefox',  color: '#cb4b16', kind: 'browser' },
  { app: 'Terminal',    title: 'user@workstation: ~/projects/ext',          color: '#859900', kind: 'terminal' },
  { app: 'Terminal',    title: 'user@workstation: ~/projects/clients/acme-corp/frontend/node_modules/.cache/webpack/production', color: '#859900', kind: 'terminal' },
  { app: 'Slack',       title: '#general — Workspace Indicator Team',       color: '#d33682', kind: 'chat' },
  { app: 'Thunderbird', title: 'Inbox — user@example.com',                  color: '#b58900', kind: 'mail', light: true },
  { app: 'Spotify',     title: 'Now Playing — Solarized Playlist',          color: '#2aa198', kind: 'music' },
  { app: 'VLC',         title: 'Big Buck Bunny.mp4',                        color: '#dc322f', kind: 'video' },
  { app: 'eog',         title: 'screenshot-2024-01-15.png — Image Viewer',  color: '#6c71c4', kind: 'image' },
  { app: 'LibreOffice', title: 'Design Document.odt — Writer',              color: '#586e75', kind: 'docs', light: true },
  { app: 'Settings',    title: 'Settings — Appearance',                     color: '#839496', kind: 'settings', light: true },
  { app: 'Code',        title: 'workspaceIndicator.js — topnotch-workspaces', color: '#268bd2', kind: 'editor' },
  { app: 'Firefox',     title: 'docs.gtk.org/gtk4 — Mozilla Firefox',       color: '#cb4b16', kind: 'browser', light: true },
  { app: 'Terminal',    title: 'user@workstation: ~/topnotch-workspaces',   color: '#859900', kind: 'terminal' },
  { app: 'Slack',       title: '#dev — TopNotch Workspaces',                color: '#d33682', kind: 'chat' },
  { app: 'Files',       title: 'Home — Files',                              color: '#839496', kind: 'docs', light: true },
  { app: 'GIMP',        title: 'Untitled-1 — GIMP',                         color: '#6c71c4', kind: 'image' },
  { app: 'mpv',         title: 'lofi-radio.m3u — mpv',                      color: '#dc322f', kind: 'video' },
  { app: 'Code',        title: 'interactions.js — topnotch-workspaces',     color: '#268bd2', kind: 'editor' },
  { app: 'Firefox',     title: 'Pull Request #1423: Refactor window selector overlay to support fisheye layout and fuzzy search — GitHub — Mozilla Firefox', color: '#cb4b16', kind: 'browser', light: true },
  { app: 'Terminal',    title: 'user@workstation: ~/ (tmux)',               color: '#859900', kind: 'terminal' },
  { app: 'Rhythmbox',   title: 'Library — Rhythmbox',                       color: '#2aa198', kind: 'music' },
  { app: 'Geary',       title: 'Inbox (3) — Geary',                         color: '#b58900', kind: 'mail' },
  { app: 'Calculator',  title: 'Calculator',                                color: '#586e75', kind: 'settings' },
  { app: 'Code',        title: 'model.js — topnotch-workspaces',            color: '#268bd2', kind: 'editor' },
];

// ==================== TEXT CLIPPING (ellipsis at the START) ====================
const FONT_FAMILY = `Cantarell, 'Segoe UI', system-ui, sans-serif`;
const measureCtx = document.createElement('canvas').getContext('2d');

function fitStart(text, weight, sizePx, maxPx) {
  measureCtx.font = `${weight} ${sizePx}px ${FONT_FAMILY}`;
  if (measureCtx.measureText(text).width <= maxPx) return text;
  let lo = 0, hi = text.length;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    const s = '…' + text.slice(text.length - mid);
    if (measureCtx.measureText(s).width <= maxPx) lo = mid; else hi = mid - 1;
  }
  return '…' + text.slice(text.length - lo).replace(/^\s+/, '');
}

// ==================== SVG ICONS ====================
const GLYPHS = {
  editor: `<path d="M9 7 L4 12 L9 17" stroke="COLOR" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
           <path d="M15 7 L20 12 L15 17" stroke="COLOR" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`,
  browser: `<circle cx="12" cy="12" r="7.5" stroke="COLOR" stroke-width="1.8" fill="none"/>
            <ellipse cx="12" cy="12" rx="7.5" ry="3" stroke="COLOR" stroke-width="1.4" fill="none"/>
            <line x1="4.5" y1="12" x2="19.5" y2="12" stroke="COLOR" stroke-width="1.4"/>`,
  terminal: `<rect x="4" y="6" width="16" height="12" rx="2" stroke="COLOR" stroke-width="1.8" fill="none"/>
             <path d="M7 11 L10 13 L7 15" stroke="COLOR" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
             <line x1="12" y1="15" x2="17" y2="15" stroke="COLOR" stroke-width="1.6" stroke-linecap="round"/>`,
  chat: `<path d="M5 6 h14 a2 2 0 0 1 2 2 v8 a2 2 0 0 1 -2 2 h-8 l-4 3 v-3 h-2 a2 2 0 0 1 -2 -2 v-8 a2 2 0 0 1 2 -2 z" fill="none" stroke="COLOR" stroke-width="1.8" stroke-linejoin="round"/>`,
  mail: `<rect x="4" y="6" width="16" height="12" rx="2" fill="none" stroke="COLOR" stroke-width="1.8"/>
         <path d="M4 8 L12 14 L20 8" fill="none" stroke="COLOR" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`,
  music: `<circle cx="8" cy="17" r="3" fill="none" stroke="COLOR" stroke-width="1.8"/>
          <circle cx="18" cy="15" r="3" fill="none" stroke="COLOR" stroke-width="1.8"/>
          <path d="M11 17 L11 7 L21 5 L21 15" fill="none" stroke="COLOR" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`,
  video: `<rect x="4" y="7" width="16" height="10" rx="2" fill="none" stroke="COLOR" stroke-width="1.8"/>
          <path d="M10 10 L15 12 L10 14 Z" fill="COLOR"/>`,
  image: `<rect x="4" y="5" width="16" height="14" rx="2" fill="none" stroke="COLOR" stroke-width="1.8"/>
          <circle cx="9" cy="10" r="1.7" fill="COLOR"/>
          <path d="M4 17 L9 12 L13 16 L16 13 L20 17" fill="none" stroke="COLOR" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`,
  docs: `<path d="M7 4 L14 4 L18 8 L18 20 L7 20 Z" fill="none" stroke="COLOR" stroke-width="1.8" stroke-linejoin="round"/>
         <path d="M14 4 L14 8 L18 8" fill="none" stroke="COLOR" stroke-width="1.8" stroke-linejoin="round"/>
         <line x1="9" y1="12" x2="16" y2="12" stroke="COLOR" stroke-width="1.4"/>
         <line x1="9" y1="15" x2="16" y2="15" stroke="COLOR" stroke-width="1.4"/>
         <line x1="9" y1="18" x2="13" y2="18" stroke="COLOR" stroke-width="1.4"/>`,
  settings: `<circle cx="12" cy="12" r="3" fill="none" stroke="COLOR" stroke-width="1.8"/>
             <path d="M12 3 L13.5 5.5 L16.5 5 L17.5 8 L20 9 L19 12 L20 15 L17.5 16 L16.5 19 L13.5 18.5 L12 21 L10.5 18.5 L7.5 19 L6.5 16 L4 15 L5 12 L4 9 L6.5 8 L7.5 5 L10.5 5.5 Z" fill="none" stroke="COLOR" stroke-width="1.5" stroke-linejoin="round"/>`,
};

function iconSVG(kind, color, size) {
  const glyph = (GLYPHS[kind] || GLYPHS.docs).replaceAll('COLOR', color);
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg">
    <rect x="1" y="1" width="22" height="22" rx="5" fill="#01212b" opacity="0.82"/>
    <rect x="1" y="1" width="22" height="22" rx="5" fill="${color}" opacity="0.18"/>
    <rect x="1" y="1" width="22" height="22" rx="5" fill="none" stroke="${color}" stroke-width="1.2" opacity="0.85"/>
    ${glyph}
  </svg>`;
}

// ==================== FAKE REVEALED WINDOW (full-screen SVG) ====================
function escapeXML(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function revealedSVG(win, W, H) {
  const c = win.color;
  const light = !!win.light;
  const ww = Math.round(W * 0.92);
  const wh = Math.round(H * 0.88);
  const wx = Math.round((W - ww) / 2);
  const wy = Math.round((H - wh) / 2);
  const tbh = 46;
  const cx = wx + 28;
  const cy = wy + tbh + 28;
  const cw = ww - 56;
  const ch = wh - tbh - 56;

  let content = '';
  const hex = a => Math.round(Math.max(0, Math.min(1, a)) * 255).toString(16).padStart(2, '0');

  switch (win.kind) {
    case 'editor': {
      content += `<rect x="${cx}" y="${cy}" width="220" height="${ch}" rx="8" fill="rgba(255,255,255,0.04)"/>`;
      for (let i = 0; i < 12; i++) {
        const w = 80 + ((i * 37) % 120);
        content += `<rect x="${cx + 20}" y="${cy + 30 + i * 26}" width="${w}" height="10" rx="3" fill="rgba(147,161,161,0.35)"/>`;
      }
      for (let i = 0; i < 24; i++) {
        const w = 200 + ((i * 53) % 500);
        const indent = (i % 5) * 24;
        content += `<rect x="${cx + 260 + indent}" y="${cy + 30 + i * 26}" width="${Math.min(w, cw - 280 - indent)}" height="10" rx="3" fill="rgba(147,161,161,0.28)"/>`;
      }
      break;
    }
    case 'browser': {
      content += `<rect x="${cx}" y="${cy}" width="${cw}" height="50" rx="25" fill="rgba(255,255,255,0.06)"/>`;
      content += `<rect x="${cx}" y="${cy + 90}" width="${cw}" height="${ch * 0.35}" rx="12" fill="${c}22"/>`;
      content += `<rect x="${cx}" y="${cy + 110 + ch * 0.35}" width="${cw * 0.6}" height="26" rx="6" fill="rgba(255,255,255,0.16)"/>`;
      for (let i = 0; i < 3; i++) {
        content += `<rect x="${cx + i * (cw / 3 + 10)}" y="${cy + 170 + ch * 0.35}" width="${cw / 3 - 20}" height="${ch * 0.35}" rx="12" fill="rgba(255,255,255,0.05)"/>`;
      }
      break;
    }
    case 'terminal': {
      content += `<rect x="${cx}" y="${cy}" width="${cw}" height="${ch}" rx="8" fill="rgba(0,0,0,0.35)"/>`;
      for (let i = 0; i < 20; i++) {
        const w = 100 + ((i * 71) % 400);
        content += `<rect x="${cx + 20}" y="${cy + 24 + i * 24}" width="${Math.min(w, cw - 40)}" height="8" rx="2" fill="${i % 3 === 0 ? c : 'rgba(147,161,161,0.4)'}"/>`;
      }
      break;
    }
    case 'chat': {
      content += `<rect x="${cx}" y="${cy}" width="280" height="${ch}" rx="8" fill="rgba(255,255,255,0.04)"/>`;
      for (let i = 0; i < 8; i++) {
        const y = cy + 24 + i * 56;
        content += `<circle cx="${cx + 30}" cy="${y + 14}" r="14" fill="${c}55"/>`;
        content += `<rect x="${cx + 56}" y="${y + 6}" width="${150 + ((i * 23) % 60)}" height="10" rx="3" fill="rgba(255,255,255,0.18)"/>`;
        content += `<rect x="${cx + 56}" y="${y + 22}" width="${80 + ((i * 17) % 40)}" height="8" rx="3" fill="rgba(255,255,255,0.10)"/>`;
      }
      for (let i = 0; i < 6; i++) {
        const y = cy + 40 + i * 84;
        const right = i % 2 === 0;
        const bw = 300 + ((i * 71) % 200);
        const bx = right ? cx + 320 + cw - 340 - bw : cx + 320;
        content += `<rect x="${bx}" y="${y}" width="${bw}" height="56" rx="14" fill="${right ? c + '44' : 'rgba(255,255,255,0.08)'}"/>`;
      }
      break;
    }
    case 'mail': {
      content += `<rect x="${cx}" y="${cy}" width="${cw * 0.42}" height="${ch}" rx="8" fill="rgba(255,255,255,0.04)"/>`;
      for (let i = 0; i < 10; i++) {
        const y = cy + 24 + i * 60;
        content += `<circle cx="${cx + 26}" cy="${y + 16}" r="12" fill="${c}55"/>`;
        content += `<rect x="${cx + 50}" y="${y + 6}" width="${150 + ((i * 31) % 80)}" height="10" rx="3" fill="rgba(255,255,255,0.20)"/>`;
        content += `<rect x="${cx + 50}" y="${y + 24}" width="${100 + ((i * 13) % 100)}" height="8" rx="3" fill="rgba(255,255,255,0.10)"/>`;
      }
      for (let i = 0; i < 16; i++) {
        const w = 200 + ((i * 71) % 400);
        content += `<rect x="${cx + cw * 0.45 + 20}" y="${cy + 60 + i * 34}" width="${Math.min(w, cw * 0.5 - 40)}" height="10" rx="3" fill="rgba(255,255,255,0.14)"/>`;
      }
      break;
    }
    case 'music': {
      const artSize = Math.min(ch * 0.7, cw * 0.4);
      content += `<rect x="${cx}" y="${cy}" width="${artSize}" height="${artSize}" rx="16" fill="${c}44"/>`;
      content += `<circle cx="${cx + artSize / 2}" cy="${cy + artSize / 2}" r="${artSize * 0.25}" fill="${c}88"/>`;
      for (let i = 0; i < 10; i++) {
        const active = i === 3;
        content += `<rect x="${cx + artSize + 30}" y="${cy + 20 + i * 36}" width="${active ? 320 : 240}" height="12" rx="4" fill="${active ? c + 'aa' : 'rgba(255,255,255,0.12)'}"/>`;
        content += `<rect x="${cx + artSize + 30}" y="${cy + 36 + i * 36}" width="140" height="8" rx="3" fill="rgba(255,255,255,0.08)"/>`;
      }
      break;
    }
    case 'video': {
      content += `<rect x="${cx}" y="${cy}" width="${cw}" height="${ch * 0.72}" rx="10" fill="rgba(0,0,0,0.5)"/>`;
      content += `<circle cx="${cx + cw / 2}" cy="${cy + ch * 0.36}" r="70" fill="${c}66"/>`;
      content += `<path d="M ${cx + cw / 2 - 24} ${cy + ch * 0.36 - 36} L ${cx + cw / 2 + 36} ${cy + ch * 0.36} L ${cx + cw / 2 - 24} ${cy + ch * 0.36 + 36} Z" fill="#fdf6e3"/>`;
      content += `<rect x="${cx}" y="${cy + ch * 0.72 + 20}" width="${cw}" height="8" rx="4" fill="rgba(255,255,255,0.15)"/>`;
      content += `<rect x="${cx}" y="${cy + ch * 0.72 + 20}" width="${cw * 0.4}" height="8" rx="4" fill="${c}"/>`;
      break;
    }
    case 'image': {
      const cols = 4, rows = 3, gap = 16;
      const cw2 = (cw - gap * (cols - 1)) / cols;
      const ch2 = (ch - gap * (rows - 1)) / rows;
      for (let r = 0; r < rows; r++) {
        for (let col = 0; col < cols; col++) {
          const a = 0.15 + ((r * cols + col) * 0.07) % 0.5;
          content += `<rect x="${cx + col * (cw2 + gap)}" y="${cy + r * (ch2 + gap)}" width="${cw2}" height="${ch2}" rx="10" fill="${c}${hex(a)}"/>`;
        }
      }
      break;
    }
    case 'docs': {
      const pageW = Math.min(cw * 0.7, 820);
      const pageX = cx + (cw - pageW) / 2;
      content += `<rect x="${pageX}" y="${cy}" width="${pageW}" height="${ch}" rx="8" fill="rgba(255,255,255,0.04)"/>`;
      for (let i = 0; i < 22; i++) {
        const y = cy + 40 + i * 32;
        const w = i === 0 ? pageW * 0.4 : (pageW * 0.5) + ((i * 47) % (pageW * 0.4));
        content += `<rect x="${pageX + 40}" y="${y}" width="${Math.min(w, pageW - 80)}" height="${i === 0 ? 18 : 10}" rx="3" fill="${i === 0 ? c + 'aa' : 'rgba(255,255,255,0.16)'}"/>`;
      }
      break;
    }
    case 'settings': {
      content += `<rect x="${cx}" y="${cy}" width="240" height="${ch}" rx="8" fill="rgba(255,255,255,0.04)"/>`;
      for (let i = 0; i < 8; i++) {
        content += `<rect x="${cx + 20}" y="${cy + 30 + i * 56}" width="${100 + ((i * 13) % 60)}" height="12" rx="4" fill="${i === 2 ? c : 'rgba(255,255,255,0.16)'}"/>`;
      }
      for (let i = 0; i < 7; i++) {
        const y = cy + 30 + i * 60;
        content += `<rect x="${cx + 270}" y="${y}" width="${Math.min(cw * 0.35, cw - 380)}" height="14" rx="4" fill="rgba(255,255,255,0.20)"/>`;
        const on = i % 2 === 0;
        const tx = cx + cw - 100;
        content += `<rect x="${tx}" y="${y - 4}" width="70" height="28" rx="14" fill="${on ? c : 'rgba(255,255,255,0.12)'}"/>`;
        content += `<circle cx="${on ? tx + 52 : tx + 18}" cy="${y + 10}" r="10" fill="#fdf6e3"/>`;
      }
      break;
    }
    default: {
      for (let i = 0; i < 16; i++) {
        const w = 200 + ((i * 71) % 500);
        content += `<rect x="${cx}" y="${cy + 40 + i * 32}" width="${Math.min(w, cw)}" height="10" rx="3" fill="rgba(147,161,161,0.3)"/>`;
      }
    }
  }

  if (light) {
    content = content
      .replace(/rgba\(255,255,255,([\d.]+)\)/g, (m, a) => `rgba(0,0,0,${Math.min(1, a * 1.1).toFixed(3)})`)
      .replace(/rgba\(147,161,161,([\d.]+)\)/g, (m, a) => `rgba(88,110,117,${a})`);
  }

  const bgOuter  = light ? '#ffffff' : '#001a22';
  const winTop   = light ? '#ffffff' : '#0d3a48';
  const winBot   = light ? '#f6f6f3' : '#04212a';
  const winLine  = light ? 'rgba(0,0,0,0.14)' : 'rgba(147,161,161,0.25)';

  const title = fitStart(`${win.app} — ${win.title}`, 600, 16, ww - 200);
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
    <defs>
      <linearGradient id="winbg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${winTop}"/>
        <stop offset="100%" stop-color="${winBot}"/>
      </linearGradient>
    </defs>
    <rect width="${W}" height="${H}" fill="${bgOuter}"/>
    <rect x="${wx}" y="${wy}" width="${ww}" height="${wh}" rx="14" fill="url(#winbg)" stroke="${winLine}" stroke-width="1"/>
    <rect x="${wx}" y="${wy}" width="${ww}" height="${tbh}" rx="14" fill="${c}" opacity="0.85"/>
    <rect x="${wx}" y="${wy + tbh - 14}" width="${ww}" height="14" fill="${c}" opacity="0.85"/>
    <circle cx="${wx + 22}" cy="${wy + tbh / 2}" r="7" fill="rgba(0,0,0,0.35)"/>
    <circle cx="${wx + 42}" cy="${wy + tbh / 2}" r="7" fill="rgba(0,0,0,0.35)"/>
    <circle cx="${wx + 62}" cy="${wy + tbh / 2}" r="7" fill="rgba(0,0,0,0.35)"/>
    <text x="${wx + ww / 2}" y="${wy + tbh / 2 + 6}" text-anchor="middle" font-family="Cantarell, sans-serif" font-size="16" font-weight="600" fill="#fdf6e3" opacity="0.95">${escapeXML(title)}</text>
    ${content}
  </svg>`;
}

// ==================== DOM ====================
const overlayEl = document.getElementById('overlay');
const revealedEl = document.getElementById('revealed');
const bgLayers = [...revealedEl.querySelectorAll('.bg-layer')];
const rowsEl = document.getElementById('rows');
const bandEl = document.getElementById('band');
const bandSelectedEl = document.getElementById('band-selected');
const searchEntry = document.getElementById('search-entry');
const hintEl = document.getElementById('hint');
const railEl = document.getElementById('rail');
const ticksEl = document.getElementById('ticks');
const markerEl = document.getElementById('marker');
const tipEl = document.getElementById('tip');

// ==================== STATE ====================
let items = WINDOWS.slice();
let layout = null;
let rowEls = [];
let selectedIndex = 0;
let scrollPos = 0;
let scrollTarget = 0;
let tweenId = 0;
let lastFrame = 0;
let wheelAcc = 0;
let bgFront = 0;
let labelSize = 26;
let selectedLabelSize = 58;
let railH = 0;
const RAIL_PAD = 10;

const ease = t => { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); };

// Opacity of a neighbor row at distance x (in rows) from the selection.
// 1 row away: strong; 2 rows: medium; gone by ~2.8.
function neighborOpacity(x) {
  if (x <= 2) return 0.92 - 0.40 * (x - 1);
  return Math.max(0, 0.52 * (1 - (x - 2) / 0.8));
}

// ==================== LAYOUT ====================
function computeLayout() {
  const W = window.innerWidth, H = window.innerHeight;
  const slotH = Math.max(44, Math.min(66, Math.round(H * 0.062)));
  const selLabel = Math.max(34, Math.min(76, Math.round(H * 0.066)));
  const selectedHeight = Math.round(selLabel * 1.95);
  const searchHeight = 52;
  const bandHeight = selectedHeight + searchHeight + 30;
  return {
    W, H, slotH, selLabel, selectedHeight, searchHeight, bandHeight,
    bandTop: Math.round((H - bandHeight) / 2),
    iconSize: Math.round(slotH * 0.44),
    selectedIconSize: Math.round(selLabel * 1.55),
  };
}

function applyLayout() {
  layout = computeLayout();
  labelSize = Math.max(18, Math.round(layout.slotH * 0.42));
  selectedLabelSize = layout.selLabel;

  layout.rowTextMax = (layout.W * 0.60 - layout.iconSize - labelSize * 0.5) * 0.96;
  layout.selTextMax = (layout.W * 0.80 - layout.selectedIconSize - selectedLabelSize * 0.4) * 0.96;

  bandEl.style.top = layout.bandTop + 'px';
  bandEl.style.height = layout.bandHeight + 'px';
  bandSelectedEl.style.height = layout.selectedHeight + 'px';
  searchEntry.style.width = Math.min(layout.W - 96, 420) + 'px';
  searchEntry.style.fontSize = '24px';
}

// ==================== NEIGHBOR ROWS ====================
function buildRows() {
  rowsEl.innerHTML = '';
  rowEls = [];
  items.forEach((win, i) => {
    const row = document.createElement('div');
    row.className = 'row';
    row.style.height = layout.slotH + 'px';
    row.style.fontSize = labelSize + 'px';
    const label = fitStart(win.title, 600, labelSize, layout.rowTextMax);
    row.innerHTML = `
      <div class="row-inner">
        <div class="row-icon">${iconSVG(win.kind, win.color, layout.iconSize)}</div>
        <div class="row-label">${escapeXML(label)}</div>
      </div>`;
    row.addEventListener('click', () => selectIndex(i));
    rowsEl.appendChild(row);
    rowEls.push(row);
  });
}

// Only ~2 rows each side are visible; the rest are fully hidden (not shrunk).
function layoutRows() {
  const L = layout;
  const pos = scrollPos;
  const a = L.bandTop - L.slotH / 2;
  const b = L.bandTop + L.bandHeight + L.slotH / 2;
  const mid = (a + b) / 2;
  const half = (b - a) / 2;

  rowEls.forEach((row, i) => {
    const d = i - pos;
    const x = Math.abs(d);
    let c, op;
    if (x >= 2.8) { row.style.display = 'none'; return; }

    if (x < 1) {
      // sliding into the middle: drifts toward the big title and fades out as it arrives
      c = mid + d * half;
      op = neighborOpacity(1) * ease((x - 0.2) / 0.8);
    } else {
      c = d > 0 ? b + (x - 1) * L.slotH : a - (x - 1) * L.slotH;
      op = neighborOpacity(x);
    }
    if (op < 0.01) { row.style.display = 'none'; return; }

    row.style.display = '';
    row.style.transform = `translate3d(0, ${(c - L.slotH / 2).toFixed(1)}px, 0)`;
    row.style.opacity = op.toFixed(3);
    row.style.pointerEvents = x < 0.6 ? 'none' : 'auto';
  });

  bandSelectedEl.style.opacity = ease(1 - Math.abs(selectedIndex - pos)).toFixed(3);
  updateMarker();
}

// ==================== SIDE SCRUBBER ====================
function railY(i) {
  const n = items.length;
  const span = Math.max(1, railH - RAIL_PAD * 2);
  if (n <= 1) return railH / 2;
  return RAIL_PAD + (i / (n - 1)) * span;
}
function railIndexFromY(py) {
  const n = items.length;
  if (n <= 1) return 0;
  const span = Math.max(1, railH - RAIL_PAD * 2);
  return Math.max(0, Math.min(n - 1, Math.round(((py - RAIL_PAD) / span) * (n - 1))));
}

function buildRail() {
  railH = railEl.clientHeight;
  ticksEl.innerHTML = '';
  items.forEach((w, i) => {
    const t = document.createElement('div');
    t.className = 'tick';
    t.style.top = railY(i).toFixed(1) + 'px';
    t.style.background = w.color;
    ticksEl.appendChild(t);
  });
  railEl.style.display = items.length ? '' : 'none';
}

function updateMarker() {
  if (!items.length) return;
  const p = Math.max(0, Math.min(items.length - 1, scrollPos));
  const lo = Math.floor(p), hi = Math.min(items.length - 1, lo + 1);
  const y = railY(lo) + (railY(hi) - railY(lo)) * (p - lo);
  markerEl.style.transform = `translate3d(0, ${y.toFixed(1)}px, 0)`;
}

let railDragging = false;
function railPointer(e, jump) {
  const r = railEl.getBoundingClientRect();
  const py = e.clientY - r.top;
  const idx = railIndexFromY(py);
  const it = items[idx];
  if (it) {
    tipEl.textContent = fitStart(`${it.app} — ${it.title}`, 700, 16, 340);
    tipEl.style.transform = `translateY(${(railY(idx) - 12).toFixed(1)}px)`;
    tipEl.classList.add('show');
  }
  if (jump) selectIndex(idx);
}
railEl.addEventListener('pointerdown', (e) => {
  railDragging = true;
  railEl.setPointerCapture(e.pointerId);
  railPointer(e, true);
});
railEl.addEventListener('pointermove', (e) => railPointer(e, railDragging));
railEl.addEventListener('pointerup', () => { railDragging = false; tipEl.classList.remove('show'); });
railEl.addEventListener('pointercancel', () => { railDragging = false; tipEl.classList.remove('show'); });
railEl.addEventListener('pointerleave', () => { if (!railDragging) tipEl.classList.remove('show'); });

// ==================== BAND + BACKGROUND ====================
function updateBand() {
  const win = items[selectedIndex];
  if (!win) {
    bandSelectedEl.innerHTML = `<div class="sel-empty" style="font-size:${Math.round(selectedLabelSize * 0.7)}px">No matching windows</div>`;
    return;
  }
  const title = fitStart(win.title, 700, selectedLabelSize, layout.selTextMax);
  bandSelectedEl.innerHTML = `
    <div class="sel" style="font-size:${selectedLabelSize}px">
      <div class="row-icon">${iconSVG(win.kind, win.color, layout.selectedIconSize)}</div>
      <div class="sel-text">
        <div class="sel-title">${escapeXML(title)}</div>
        <div class="sel-app" style="font-size:${Math.max(12, Math.round(selectedLabelSize * 0.3))}px">${escapeXML(win.app)}</div>
      </div>
    </div>`;
  bandSelectedEl.querySelector('.sel').addEventListener('click', activate);
}

function updateBackground() {
  const win = items[selectedIndex];
  const next = 1 - bgFront;
  const nextEl = bgLayers[next], frontEl = bgLayers[bgFront];
  nextEl.style.transition = 'none';
  nextEl.style.opacity = '0';
  nextEl.style.zIndex = '2';
  frontEl.style.zIndex = '1';
  nextEl.innerHTML = win ? revealedSVG(win, layout.W, layout.H) : '';
  void nextEl.offsetWidth;
  nextEl.style.transition = 'opacity 150ms ease-out';
  nextEl.style.opacity = '1';
  bgFront = next;
}

function updateHint() {
  const n = items.length;
  const pos = n ? `${selectedIndex + 1} / ${n}` : '0 / 0';
  hintEl.textContent = `${pos}   •   ↑↓ Navigate   •   Drag the right rail to jump   •   Enter / Click to Activate   •   Esc to Close`;
}

// ==================== SELECTION / TWEEN ====================
function selectIndex(index, { instant = false } = {}) {
  if (!items.length) return;
  index = Math.max(0, Math.min(items.length - 1, index));
  if (index === selectedIndex && !instant) return;
  selectedIndex = index;
  scrollTarget = index;

  if (instant) {
    scrollPos = index;
    if (tweenId) { cancelAnimationFrame(tweenId); tweenId = 0; }
    layoutRows();
  } else {
    startTween();
  }

  updateBand();
  updateBackground();
  updateHint();
}

function startTween() {
  if (tweenId) return;
  lastFrame = performance.now();
  const step = (now) => {
    const dt = Math.min(now - lastFrame, 50);
    lastFrame = now;
    const diff = scrollTarget - scrollPos;
    if (Math.abs(diff) < 0.002) {
      scrollPos = scrollTarget;
      layoutRows();
      tweenId = 0;
      return;
    }
    scrollPos += diff * (1 - Math.exp(-dt / 70));
    layoutRows();
    tweenId = requestAnimationFrame(step);
  };
  tweenId = requestAnimationFrame(step);
}

// ==================== SEARCH / FILTER ====================
function applyFilter() {
  const tokens = searchEntry.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const prev = items[selectedIndex];
  items = tokens.length
    ? WINDOWS.filter(w => {
        const hay = (w.app + ' ' + w.title).toLowerCase();
        return tokens.every(t => hay.includes(t));
      })
    : WINDOWS.slice();

  let idx = prev ? items.indexOf(prev) : -1;
  if (idx < 0) idx = 0;
  selectedIndex = idx;
  scrollPos = scrollTarget = idx;
  if (tweenId) { cancelAnimationFrame(tweenId); tweenId = 0; }

  buildRows();
  buildRail();
  layoutRows();
  updateBand();
  updateBackground();
  updateHint();
}
searchEntry.addEventListener('input', applyFilter);

// ==================== ACTIVATE / CANCEL ====================
function activate() {
  if (!items.length) return;
  overlayEl.classList.add('activating');
  setTimeout(() => overlayEl.classList.remove('activating'), 900);
}
function cancel() {
  overlayEl.classList.add('cancelling');
  setTimeout(() => overlayEl.classList.remove('cancelling'), 180);
}
revealedEl.addEventListener('click', activate);

// ==================== EVENTS ====================
document.addEventListener('keydown', (e) => {
  const inEntry = e.target === searchEntry;

  if (!inEntry && !e.ctrlKey && !e.metaKey && !e.altKey && (e.key.length === 1 || e.key === 'Backspace')) {
    searchEntry.focus();
    return;
  }

  switch (e.key) {
    case 'ArrowDown': e.preventDefault(); selectIndex(selectedIndex + 1); break;
    case 'ArrowUp':   e.preventDefault(); selectIndex(selectedIndex - 1); break;
    case 'PageDown':  e.preventDefault(); selectIndex(selectedIndex + 5); break;
    case 'PageUp':    e.preventDefault(); selectIndex(selectedIndex - 5); break;
    case 'Enter':     e.preventDefault(); activate(); break;
    case 'Escape':
      e.preventDefault();
      if (searchEntry.value) { searchEntry.value = ''; applyFilter(); }
      else cancel();
      break;
    case 'Home': if (!inEntry) { e.preventDefault(); selectIndex(0); } break;
    case 'End':  if (!inEntry) { e.preventDefault(); selectIndex(items.length - 1); } break;
  }
});

document.addEventListener('wheel', (e) => {
  e.preventDefault();
  wheelAcc += e.deltaY;
  const STEP = 60;
  while (Math.abs(wheelAcc) >= STEP) {
    const s = Math.sign(wheelAcc);
    selectIndex(selectedIndex + s);
    wheelAcc -= s * STEP;
  }
}, { passive: false });

window.addEventListener('resize', () => {
  applyLayout();
  buildRows();
  buildRail();
  layoutRows();
  updateBand();
  updateBackground();
});

// ==================== INIT ====================
function init() {
  applyLayout();
  buildRows();
  buildRail();
  layoutRows();
  updateBand();
  updateBackground();
  updateHint();
  searchEntry.focus();
}
init();
</script>
</body>
</html>
