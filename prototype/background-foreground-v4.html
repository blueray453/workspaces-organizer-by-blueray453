<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transparent Box Layout Simulation</title>
    <style>
        /* Force a solid white background to test visibility */
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* The container setup mimicking a GNOME Extension panel widget box */
        .my-stroked-label {
            /* 1. Transparent box configuration */
            background-color: rgba(0, 0, 0, 0.4);
            /* Black box with 40% opacity */
            border-radius: 8px;
            /* Rounded corners */
            padding: 12px 24px;
            /* Inner spacing around the text */
            display: inline-block;
            /* Forces box to hug the text size */

            /* 2. Text typography */
            color: #ffffff;
            /* Inside letter fill color */
            font-size: 24px;
            font-weight: bold;

            /* 3. The 8-way shadow simulation for the crisp border */
            text-shadow:
                -1px 0px 0 #000000,
                1px 0px 0 #000000,
                0px -1px 0 #000000,
                0px 1px 0 #000000,
                -1px -1px 0 #000000,
                1px -1px 0 #000000,
                -1px 1px 0 #000000,
                1px 1px 0 #000000;
        }
    </style>
</head>

<body>

    <!-- The complete widget setup -->
    <div class="my-stroked-label">
        Outlined Text Inside Box
    </div>

</body>

</html>
